name: iOS TestFlight

# Builds the iPhone app with Xcode on GitHub's macOS runner and uploads the .ipa
# to App Store Connect, which is what puts it into TestFlight. No Expo cloud and
# no EAS: the JavaScript is bundled by the Xcode build itself, and the Xcode
# project is generated from app.json in this job because it is not committed.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID  (Users and Access → Integrations)
#   ASC_ISSUER_ID   the issuer UUID shown on that page
#   ASC_PRIVATE_KEY the entire .p8 file, BEGIN/END lines included
# The key must belong to a Team key with the App Manager or Admin role: Xcode
# asks Apple for the distribution certificate during the export, and a narrower
# role is refused.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to TestFlight"
        type: boolean
        default: true
      version:
        description: "Marketing version, e.g. 1.1.0 (blank keeps app.json)"
        type: string
        required: false
  push:
    tags:
      - "ios-v*"

# Two builds pushing to the same app at once is how a build number collides, so
# releases queue instead of racing.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: BH7WW2BR39
      TEAM_APP_ID: "6835960485"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect refuses builds made with an older SDK, and the image's
      # default Xcode is not always the newest one installed.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Fails in seconds with something actionable, instead of fifteen minutes
      # into a build that cannot sign.
      - name: Check the release is configured
        working-directory: mobile
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Create a Team API key under App Store Connect → Users and Access → Integrations and add all three parts."
            exit 1
          fi
          node -e '
            const app = require("./app.json").expo;
            const version = process.env.VERSION_INPUT || app.version;
            console.log(`team ${process.env.TEAM_ID} (app ${process.env.TEAM_APP_ID})`);
            console.log(`bundle ${app.ios.bundleIdentifier}, version ${version}`);
            console.log("The app record in App Store Connect must use this exact bundle identifier.");
          '
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      # The build number has to move on every upload or App Store Connect rejects
      # the build as a duplicate; the run number is unique and monotonic. The
      # marketing version only changes when someone asks for it.
      - name: Stamp versions
        working-directory: mobile
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            if (process.env.VERSION_INPUT) app.expo.version = process.env.VERSION_INPUT;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log(`version ${app.expo.version} (${app.expo.ios.buildNumber})`);
          '

      - name: Generate the Xcode project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          pod --version || sudo gem install cocoapods
          pod install --repo-update

      - name: Import the App Store Connect key
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$dir/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        id: archive
        working-directory: mobile/ios
        run: |
          # A failing xcodebuild must fail the step, not disappear into tee.
          set -euo pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild archive \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AthenIQ.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tee "$RUNNER_TEMP/archive.log" | tail -40

      - name: Export the .ipa
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AthenIQ.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | tail -20
          ls -lh "$RUNNER_TEMP/export"

      # altool is deprecated in name only; it is still the tool Apple documents
      # for command-line uploads, and it reads the key from the directory written
      # above. Validation first, so a bad icon or entitlement fails in seconds.
      - name: Upload to TestFlight
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.upload == 'true'
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $(basename "$ipa") for app $TEAM_APP_ID"
          xcrun altool --validate-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### Uploaded to App Store Connect"
            echo "- team $TEAM_ID, app $TEAM_APP_ID"
            echo "- version $(node -p "require('./mobile/app.json').expo.version") build $(node -p "require('./mobile/app.json').expo.ios.buildNumber")"
            echo "- TestFlight processing takes a few minutes; assign the build to an internal group in App Store Connect to hand it out."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the .ipa and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
