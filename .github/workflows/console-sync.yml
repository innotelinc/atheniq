# ═══════════════════════════════════════════════════════════════════════════
# console-sync.yml — keep console/ equal to the repository that owns it.
#
# The registrar console is developed in `innotelinc/atheniq-console`, and this
# repository builds it from `console/` so the compose file stands alone. A copy
# that drifts is worse than no copy at all: the image built here would slowly
# stop being the app that is actually deployed. So this copies the app source
# across whenever upstream main moves, and commits the difference.
#
# What moves: app/, components/, lib/, middleware.ts, next.config.mjs,
# package.json, package-lock.json, tsconfig.json — everything the build compiles,
# deleted files included (a route theatre upstream dropped must not survive
# here). What stays: README.md and Dockerfile, which this repository writes for
# its own copy.
#
# The upstream repository is private and the default GITHUB_TOKEN cannot read
# across repositories, so the job needs a repository secret CONSOLE_SYNC_TOKEN:
# a fine-grained PAT with "Contents: read" on innotelinc/atheniq-console. Without
# it the job fails loudly rather than reporting a sync it never made.
# ═══════════════════════════════════════════════════════════════════════════
name: Console sync

on:
  schedule:
    # Hourly. The console changes a few times a week; an hour of lag is cheaper
    # than a webhook that a fresh clone of the app repo cannot set up.
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    # The app repo may ping this one after a push (`gh api .../dispatches -f
    # event_type=console-push`) to skip the wait.
    types: [console-push]

permissions:
  contents: write

concurrency:
  group: console-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror atheniq-console into console/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require the upstream token
        env:
          TOKEN: ${{ secrets.CONSOLE_SYNC_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CONSOLE_SYNC_TOKEN is unset, so the mirror cannot read the private app repository. Add a fine-grained PAT with Contents: read on innotelinc/atheniq-console."
            exit 1
          fi

      - name: Fetch the app repository
        uses: actions/checkout@v7
        with:
          repository: innotelinc/atheniq-console
          ref: main
          token: ${{ secrets.CONSOLE_SYNC_TOKEN }}
          path: .upstream
          fetch-depth: 1

      - name: Copy the app source into console/
        run: |
          set -euo pipefail
          revision="$(git -C .upstream rev-parse --short HEAD)"
          echo "UPSTREAM=${revision}" >> "$GITHUB_ENV"
          for path in app components lib middleware.ts next.config.mjs \
                      package.json package-lock.json tsconfig.json; do
            rsync --archive --delete ".upstream/${path}" console/
          done
          rm -rf .upstream

      - name: Commit the mirror when it moved
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- console)" ]; then
            echo "console/ already matches atheniq-console@${UPSTREAM}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all console
          git commit \
            --message "Mirror atheniq-console@${UPSTREAM} into console/" \
            --message "The console app is developed in innotelinc/atheniq-console. This copies its source here so the image this repository builds is the app that is deployed; README.md and Dockerfile remain this repository's own."
          git push
