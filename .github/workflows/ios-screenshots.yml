name: App Store screenshots

# Captures the screenshot sets Apple requires before a version can be submitted
# — the 6.9-inch iPhone set (1320×2868), the 6.3-inch one (1206×2622) and the
# 13-inch iPad set — and (when the App Store Connect key is present) writes them
# into the draft version. Runs on a macOS runner because the sets have to come
# from real iOS simulators: a draft missing any of these sizes cannot be sent to
# review, which is what a 6.9-inch-only upload found out.
#
# The app is built Release, not Debug: a Debug build loads its JavaScript from a
# Metro server that is not running on the runner, so it would open to a blank
# screen.
#
# Order matters — screenshots hang off the draft version:
#   1. iOS TestFlight                       (build reaches App Store Connect)
#   2. App Store draft submission           (creates the version + metadata)
#   3. App Store screenshots                (this workflow)
#   4. age rating and the review submission, in App Store Connect
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the set to App Store Connect"
        type: boolean
        default: true

concurrency:
  group: ios-screenshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-latest
    # Three simulators, a Release build and three capture passes do not fit in
    # an hour: two runs were cancelled by this timeout mid-capture, which is why
    # the 6.3-inch set never landed.
    timeout-minutes: 110
    env:
      TEAM_APP_ID: "6835960485"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: console/mobile
        run: npm ci

      - name: Generate the Xcode project
        working-directory: console/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: console/mobile/ios
        run: pod install --repo-update

      - name: Build for the simulator
        working-directory: console/mobile/ios
        run: |
          set -euo pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/sim-build.log" | tail -30

      # A 6.9-inch device is the whole point: any other iPhone captures a size
      # Apple will not accept in this slot.
      - name: Boot a 6.9-inch simulator
        id: sim
        run: |
          set -euo pipefail
          udid=""
          name=""
          # A lookup that finds nothing must not end the step: with `set -e` a
          # failing grep in a command substitution exits the whole script, which
          # is what killed the iPad pass before it could fall back.
          for candidate in "iPhone 17 Pro Max" "iPhone 16 Pro Max"; do
            udid=$( { xcrun simctl list devices available | grep -F "$candidate (" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'; } || true )
            if [ -n "$udid" ]; then name="$candidate"; break; fi
          done
          if [ -z "$udid" ]; then
            runtime=$( { xcrun simctl list runtimes | grep -F iOS | tail -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/'; } || true )
            devicetype=$( { xcrun simctl list devicetypes | grep -F "iPhone 16 Pro Max" | head -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+).*/\1/'; } || true )
            test -n "$runtime" -a -n "$devicetype"
            udid=$(xcrun simctl create "AthenIQ screenshots" "$devicetype" "$runtime")
            name="created iPhone 16 Pro Max"
          fi
          echo "device $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          open -a Simulator
          xcrun simctl ui "$udid" appearance dark || true
          # A store screenshot showing 3% battery and no signal reads as broken.
          xcrun simctl status_bar "$udid" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      # The app declares tablet support, so App Review also wants the 13-inch
      # iPad set. It is the same simulator build on a second device, not a
      # device-specific archive.
      - name: Boot a 13-inch iPad simulator
        id: sim_ipad
        run: |
          set -euo pipefail
          udid=""
          # Any iPad Pro is acceptable: the upload accepts both 2064x2752 (13-inch
          # M4) and 2048x2732 (12.9-inch) in the 13-inch slot.
          for candidate in "iPad Pro 13-inch (M5)" "iPad Pro 13-inch (M4)" "iPad Pro 12.9-inch (6th generation)" "iPad Pro 12.9-inch (5th generation)"; do
            udid=$( { xcrun simctl list devices available | grep -F "$candidate (" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'; } || true )
            if [ -n "$udid" ]; then echo "device $candidate ($udid)"; break; fi
          done
          if [ -z "$udid" ]; then
            runtime=$( { xcrun simctl list runtimes | grep -F iOS | tail -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/'; } || true )
            devicetype=$( { xcrun simctl list devicetypes | grep -F "iPad Pro 13-inch" | head -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+).*/\1/'; } || true )
            if [ -z "$devicetype" ]; then
              devicetype=$( { xcrun simctl list devicetypes | grep -F "iPad Pro 12.9-inch" | head -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+).*/\1/'; } || true )
            fi
            if [ -z "$runtime" ] || [ -z "$devicetype" ]; then
              echo "::error::No iPad Pro simulator is available on this runner."
              xcrun simctl list devicetypes | grep -i ipad | head -5
              exit 1
            fi
            udid=$(xcrun simctl create "AthenIQ pad screenshots" "$devicetype" "$runtime")
            echo "created an iPad Pro 12.9-inch"
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark || true

      # The 6.3-inch phone is its own display slot (APP_IPHONE_61). App Review
      # wants it beside the 6.9-inch set, and a 6.9-inch frame is refused there.
      - name: Boot a 6.3-inch iPhone simulator
        id: sim_61
        run: |
          set -euo pipefail
          udid=""
          # 1206×2622 is an iPhone 16/17 Pro; 1179×2556 (the 15/14 Pro) is also
          # accepted in this slot, so either device answers the requirement.
          for candidate in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 15 Pro"; do
            udid=$( { xcrun simctl list devices available | grep -F "$candidate (" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'; } || true )
            if [ -n "$udid" ]; then echo "device $candidate ($udid)"; break; fi
          done
          if [ -z "$udid" ]; then
            runtime=$( { xcrun simctl list runtimes | grep -F iOS | tail -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/'; } || true )
            devicetype=$( { xcrun simctl list devicetypes | grep -F "iPhone 16 Pro" | head -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+).*/\1/'; } || true )
            if [ -z "$devicetype" ]; then
              devicetype=$( { xcrun simctl list devicetypes | grep -F "iPhone 15 Pro" | head -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+).*/\1/'; } || true )
            fi
            if [ -z "$runtime" ] || [ -z "$devicetype" ]; then
              echo "::error::No 6.3-inch iPhone simulator is available on this runner."
              exit 1
            fi
            udid=$(xcrun simctl create "AthenIQ 6.3 screenshots" "$devicetype" "$runtime")
            echo "created a 6.3-inch iPhone"
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark || true

      - name: Capture
        id: capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          IPAD_UDID: ${{ steps.sim_ipad.outputs.udid }}
          PHONE61_UDID: ${{ steps.sim_61.outputs.udid }}
          API_BASE: https://registrar.atheniq.institute
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          echo "app $app"
          bash console/scripts/capture-store-screenshots.sh "$UDID" "$app" screenshots "1320x2868" "$API_BASE"
          bash console/scripts/capture-store-screenshots.sh "$PHONE61_UDID" "$app" screenshots-61 "1206x2622,1179x2556" "$API_BASE"
          bash console/scripts/capture-store-screenshots.sh "$IPAD_UDID" "$app" screenshots-ipad "2064x2752,2048x2732" "$API_BASE"

      - name: Upload to App Store Connect
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. The screenshots are attached to this run; add the key to upload them."
            exit 1
          fi
          node console/scripts/asc-screenshots.mjs --dir screenshots --display APP_IPHONE_67 --apply
          node console/scripts/asc-screenshots.mjs --dir screenshots-61 --display APP_IPHONE_61 --apply
          node console/scripts/asc-screenshots.mjs --dir screenshots-ipad --display APP_IPAD_PRO_3GEN_129 --apply

      - name: Keep the screenshots and the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: |
            screenshots/*.png
            screenshots-61/*.png
            screenshots-ipad/*.png
            ${{ runner.temp }}/sim-build.log
          if-no-files-found: ignore
